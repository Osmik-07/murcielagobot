name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH и деплой на VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          # Команда не имеет значения: у ключа deploy на сервере forced command
          # в authorized_keys — что бы сюда ни написали, выполнится ровно
          # deploy/deploy.sh и ничего больше.
          script: echo triggering deploy
